<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English to Yoruba Translator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0914;
      /* Spluttered Blue & Purple Radial Mesh Gradient */
      background-image: 
        radial-gradient(at 15% 15%, rgba(59, 130, 246, 0.45) 0px, transparent 55%),
        radial-gradient(at 85% 20%, rgba(147, 51, 234, 0.45) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(124, 58, 237, 0.35) 0px, transparent 60%),
        radial-gradient(at 80% 75%, rgba(37, 99, 235, 0.3) 0px, transparent 45%),
        radial-gradient(at 20% 80%, rgba(168, 85, 247, 0.25) 0px, transparent 40%);
      background-attachment: fixed;
      color: #f3f4f6;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      /* Glassmorphism Card */
      background: rgba(18, 16, 38, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    /* Header Styling */
    .header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    /* Translation History Display Box */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.98rem;
      line-height: 1.5;
      animation: fadeIn 0.25s ease-out;
    }

    .user-msg {
      align-self: flex-end;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-msg {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .bot-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #c084fc;
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ChatGPT-style Floating Search Bar */
    .input-container {
      position: relative;
      margin-top: 12px;
    }

    .input-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 16px 56px 16px 20px;
      font-size: 0.98rem;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .input-box::placeholder {
      color: #8b8f9e;
    }

    .input-box:focus {
      border-color: #8b5cf6;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }

    .send-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .send-btn:hover {
      transform: translateY(-50%) scale(1.05);
    }

    .send-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1>English to Yoruba</h1>
      <p>NLLB-200 + LoRA Neural Machine Translation</p>
    </div>

    <!-- Output History -->
    <div class="chat-box" id="chatBox">
      <div class="message bot-msg">
        <span class="bot-label">Yorùbá AI</span>
        Ẹ kàn tẹ gbólóhùn gẹ̀ẹ́sì yín sí ìsàlẹ̀ láti gbà ògbufọ̀! (Type your English sentence below to translate!)
      </div>
    </div>

    <!-- ChatGPT Search/Input Bar -->
    <div class="input-container">
      <input 
        type="text" 
        id="userInput" 
        class="input-box" 
        placeholder="What do you want to translate?" 
        onkeydown="if(event.key === 'Enter') handleTranslate()"
      />
      <button class="send-btn" onclick="handleTranslate()" id="sendBtn">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    async function handleTranslate() {
      const inputEl = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = inputEl.value.trim();

      if (!text) return;

      // 1. Append User Input Message
      const userMsg = document.createElement('div');
      userMsg.className = 'message user-msg';
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);

      inputEl.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // 2. Append Loading Placeholder for Translation
      const botMsg = document.createElement('div');
      botMsg.className = 'message bot-msg';
      botMsg.innerHTML = '<span class="bot-label">Yorùbá AI</span><em>Translating...</em>';
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        // 3. Post Request to your FastAPI Backend
        const response = await fetch('http://127.0.0.1:8000/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        if (data.translated_text) {
          botMsg.innerHTML = `<span class="bot-label">Yorùbá AI</span>${data.translated_text}`;
        } else {
          botMsg.innerHTML = `<span class="bot-label">Error</span>Could not translate text.`;
        }
      } catch (err) {
        botMsg.innerHTML = `<span class="bot-label">Connection Error</span>Is your FastAPI backend running on port 8000?`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
